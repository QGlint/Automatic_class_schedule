name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PROJECT: Automatic_class_schedule\Automatic_class_schedule.csproj

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Publish (self-contained)
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r win-x64
          --self-contained true
          -p:WindowsPackageType=None
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=true
          -p:PublishTrimmed=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish\app

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Create ZIP
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $zipName = "Automatic_class_schedule_v${ver}_win-x64.zip"
          Compress-Archive -Path "publish\app\*" -DestinationPath "publish\$zipName" -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ACS自动排课 v${{ steps.version.outputs.VERSION }}"
          body: |
            ## ACS自动排课 v${{ steps.version.outputs.VERSION }}

            ### 安装
            1. 下载 ZIP 解压到任意目录
            2. 运行 `Automatic_class_schedule.exe`
            3. SmartScreen 提示 → "更多信息" → "仍要运行"

            ### 系统要求
            - Windows 10 1809+ / Windows 11 (x64)
            - 自包含发布，无需安装 .NET 运行时
          files: publish/${{ env.ZIP_NAME }}
          draft: true
          prerelease: false
