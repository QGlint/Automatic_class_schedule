name: Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PROJECT: Automatic_class_schedule\Automatic_class_schedule.csproj

jobs:
  build-msix:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $ver) { $ver = "1.0.0" }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      # 从 Secrets 注入真实 Publisher 信息
      - name: Generate manifest from secrets
        shell: pwsh
        run: |
          $manifest = "Automatic_class_schedule\Package.appxmanifest"
          $content = Get-Content $manifest -Raw
          $content = $content -replace 'CN=YOUR_PUBLISHER_ID_HERE', '${{ secrets.PUBLISHER_ID }}'
          $content = $content -replace 'YOUR_PUBLISHER_DISPLAY_NAME', '${{ secrets.PUBLISHER_DISPLAY_NAME }}'
          Set-Content $manifest $content -Encoding UTF8
          Write-Host "Manifest updated with Publisher from secrets"

      - name: Restore
        run: dotnet restore

      - name: Build MSIX (StoreUpload)
        run: >
          dotnet build ${{ env.PROJECT }}
          -c Release
          -r win-x64
          -p:WindowsPackageType=MSIX
          -p:UapAppxPackageBuildMode=StoreUpload
          -p:AppxPackageSigningEnabled=false
          -p:DebugType=none
          -p:DebugSymbols=false
          "-t:Build;_GenerateAppxPackage"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACS自动排课-${{ steps.version.outputs.VERSION }}-Store
          path: Automatic_class_schedule/**/*.msixupload
          if-no-files-found: error